<div class="inline-flex items-center gap-3 text-slate-800" role="status" aria-live="polite">
  <!-- Visual Indicator Container -->
  <div class="flex items-center justify-center">
    @switch (type()) {
      @case ('dots') {
        <!-- Bouncing Dots -->
        <div class="flex items-center gap-1.5">
          <span [class]="'rounded-full bg-current spinner-dot-1 ' + dotSizeClass() + ' ' + colorClass()"></span>
          <span [class]="'rounded-full bg-current spinner-dot-2 ' + dotSizeClass() + ' ' + colorClass()"></span>
          <span [class]="'rounded-full bg-current spinner-dot-3 ' + dotSizeClass() + ' ' + colorClass()"></span>
        </div>
      }

      @case ('bars') {
        <!-- Equalizer Wave Bars -->
        <div class="flex items-center gap-1">
          <span [class]="'rounded-full bg-current spinner-bar-1 ' + barSizeClass() + ' ' + colorClass()"></span>
          <span [class]="'rounded-full bg-current spinner-bar-2 ' + barSizeClass() + ' ' + colorClass()"></span>
          <span [class]="'rounded-full bg-current spinner-bar-3 ' + barSizeClass() + ' ' + colorClass()"></span>
          <span [class]="'rounded-full bg-current spinner-bar-4 ' + barSizeClass() + ' ' + colorClass()"></span>
        </div>
      }

      @case ('ring') {
        <!-- Dual Ring Glow Spinner -->
        <div [class]="'relative animate-spin ' + sizeClass() + ' ' + colorClass()">
          <svg viewBox="0 0 50 50" class="w-full h-full">
            <circle
              cx="25"
              cy="25"
              r="20"
              fill="none"
              stroke="currentColor"
              stroke-width="4"
              class="opacity-20"
            ></circle>
            <circle
              cx="25"
              cy="25"
              r="20"
              fill="none"
              stroke="currentColor"
              stroke-width="4"
              stroke-dasharray="80"
              stroke-dashoffset="60"
              stroke-linecap="round"
            ></circle>
          </svg>
        </div>
      }

      @default {
        <!-- Classic Rotating Spinner -->
        <span
          [class]="'inline-block border-2 border-current border-t-transparent rounded-full animate-spin ' + sizeClass() + ' ' + colorClass()"
        ></span>
      }
    }
  </div>

  <!-- Text Label & Subtext -->
  @if (label() || subtext()) {
    <div class="flex flex-col">
      @if (label()) {
        <p class="font-semibold tracking-tight text-current">
          {{ label() }}
        </p>
      }

      @if (subtext()) {
        <p class="text-xs text-slate-500">
          {{ subtext() }}
        </p>
      }
    </div>
  }
</div>
